<title>Bolsillo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EBEFF6;--surface:#FFFFFF;--surface2:#F2F5FA;--ink:#0E1933;--muted:#5A6684;--line:#DCE2EE;
  --accent:#2748D9;--accent-soft:rgba(39,72,217,.12);--accent-ink:#FFFFFF;
  --pos:#0E8A5C;--neg:#CF3640;--warn:#B96E00;--tabbg:rgba(255,255,255,.9);--scrim:rgba(6,12,28,.45);
  --f-d:'Bricolage Grotesque',-apple-system,'SF Pro Display',system-ui,sans-serif;
  --f-b:'Instrument Sans',-apple-system,'SF Pro Text',system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#080D1C;--surface:#121A31;--surface2:#0D1428;--ink:#EAEFFF;--muted:#94A0C0;--line:#222C4A;--pos:#3ED598;--neg:#FF6B74;--warn:#F2A83B;--tabbg:rgba(18,26,49,.92);--scrim:rgba(0,0,0,.6);color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#080D1C;--surface:#121A31;--surface2:#0D1428;--ink:#EAEFFF;--muted:#94A0C0;--line:#222C4A;--pos:#3ED598;--neg:#FF6B74;--warn:#F2A83B;--tabbg:rgba(18,26,49,.92);--scrim:rgba(0,0,0,.6);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--f-b);-webkit-font-smoothing:antialiased;min-height:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
#app{max-width:520px;margin:0 auto;padding-bottom:110px;min-height:100vh}
.ico{display:inline-flex;vertical-align:middle}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.num{font-family:var(--f-d);font-variant-numeric:tabular-nums;font-feature-settings:"tnum";letter-spacing:-.01em}
.pos{color:var(--pos)}.neg{color:var(--neg)}
h1,h2,h3{font-family:var(--f-d);margin:0;letter-spacing:-.02em}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;padding:18px 18px 10px;gap:10px}
.top h1{font-size:32px;line-height:1.05;font-weight:700}
.top .sub{font-size:13px;color:var(--muted);margin-top:4px}
.tools{display:flex;gap:8px}
.ibtn{width:38px;height:38px;border-radius:50%;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.ibtn.on{background:var(--accent);color:var(--accent-ink)}
.sectitle{display:flex;justify-content:space-between;align-items:baseline;padding:6px 20px 8px}
.sectitle h2{font-size:17px;font-weight:700}
.link{color:var(--accent);font-weight:600;font-size:14px}

/* grouped lists */
.grp{background:var(--surface);border-radius:16px;overflow:hidden;margin:0 16px 18px}
.grp.tight{margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:54px;position:relative;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:62px;right:0;border-top:1px solid var(--line)}
.row.plain+.row.plain::before,.plain .row+.row::before{left:14px}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{min-width:84px;font-family:var(--f-d);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.row .amt small{display:block;font-family:var(--f-b);font-size:11.5px;color:var(--muted)}
.row.slim{min-height:42px;padding:7px 14px}
.row.slim .tile{width:26px;height:26px;font-size:14px;border-radius:8px}
.row.slim+.row::before{left:52px}
.tile{width:38px;height:38px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.chev{color:var(--muted);opacity:.6;flex:none}
.dayhead{display:flex;justify-content:space-between;padding:10px 22px 6px;font-size:12.5px;color:var(--muted);font-weight:600;text-transform:capitalize}
.empty{padding:34px 24px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-d);font-size:18px;margin-bottom:6px}

/* hero */
.hero{margin:0 16px 14px;padding:18px 18px 8px;background:var(--surface);border-radius:22px}
.hero .lbl{font-size:13px;color:var(--muted);font-weight:500}
.hero .big{font-family:var(--f-d);font-weight:700;font-size:40px;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.hero .delta{font-size:13px;margin-top:2px}
.split3{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:0 16px 14px;background:var(--surface);border-radius:16px;overflow:hidden}
.split3>div{padding:12px 14px}
.split3>div+div{border-left:1px solid var(--line)}
.split3 .l{font-size:12px;color:var(--muted)}
.split3 .v{font-family:var(--f-d);font-weight:500;font-size:16px;margin-top:2px;font-variant-numeric:tabular-nums}
.pnav{display:flex;align-items:center;justify-content:space-between;margin:0 16px 12px;background:var(--surface);border-radius:14px;padding:4px}
.pnav b{font-family:var(--f-d);font-size:15px;text-transform:capitalize}
.pnav button{width:40px;height:36px;border-radius:10px;color:var(--ink)}
.pnav button:disabled{opacity:.3}

/* bars & gauges */
.bar{height:8px;background:var(--surface2);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--accent)}
.bar.warn>i{background:var(--warn)}.bar.over>i{background:var(--neg)}
.gauge{position:relative;display:flex;justify-content:center;margin:6px auto 0;max-width:280px}
.gauge .mid{position:absolute;left:0;right:0;bottom:6px;text-align:center}
.gauge .mid .num{font-size:30px;font-weight:700;line-height:1.1;display:block}
.donutbox{position:relative;max-width:190px;margin:8px auto}
.donutbox .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.card{background:var(--surface);border-radius:16px;margin:0 16px 14px;padding:14px 16px}
.card.chart{padding:14px 10px 10px}
.card h3{font-size:15px;margin-bottom:6px}
.callout{margin:0 16px 14px;padding:12px 14px;border-radius:14px;background:var(--accent-soft);font-size:14px}
.callout b{font-family:var(--f-d)}

/* controls */
.seg{display:flex;background:var(--surface);border-radius:12px;padding:3px;margin:0 16px 14px;gap:2px}
.grp .seg{background:var(--bg);margin:0}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;background:var(--surface);font-weight:600;font-size:13px;color:var(--ink);white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:600;text-align:center;font-size:16px}
.btn.ghost{background:var(--surface);color:var(--accent)}
.btn.danger{background:var(--surface);color:var(--neg)}
.btn.danger-fill{background:var(--neg);color:#fff}
.btn[disabled]{opacity:.4;pointer-events:none}
.btnrow{display:flex;gap:10px;margin-top:14px}
.pad{padding:8px 18px 18px}
.field{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:52px;position:relative}
.field+.field::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:1px solid var(--line)}
.field label,.field .lab{width:124px;flex:none;color:var(--muted);font-size:14px}
.field input,.field select,.field textarea{flex:1;min-width:0;border:0;background:transparent;outline:0;padding:0;font-size:16px;text-align:right}
.field textarea{resize:none;min-height:40px}
.field select{direction:rtl;appearance:none;-webkit-appearance:none;padding-right:2px}
.field.left input{text-align:left}
.field .val{flex:1;text-align:right;display:flex;justify-content:flex-end;align-items:center;gap:8px;min-width:0}
.field .val span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{position:relative;width:50px;height:30px;border-radius:16px;background:var(--line);flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw.on{background:var(--pos)}.sw.on::after{transform:translateX(20px)}
.bigamt{display:flex;align-items:baseline;justify-content:center;gap:8px;padding:14px 16px 6px}
.bigamt input{font-family:var(--f-d);font-weight:700;font-size:44px;width:100%;max-width:280px;text-align:center;border:0;background:transparent;outline:0;letter-spacing:-.03em}
.bigamt select{border:0;background:var(--surface);border-radius:10px;padding:6px 8px;font-weight:600}
.swatches{display:flex;flex-wrap:wrap;gap:10px;padding:12px 14px}
.swatches button{width:32px;height:32px;border-radius:50%;border:3px solid transparent}
.swatches button.on{border-color:var(--ink)}
.emojigrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:8px 12px}
.emojigrid button{font-size:24px;padding:6px 0;border-radius:10px}
.emojigrid button:active{background:var(--accent-soft)}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:6px 16px 12px}
.catgrid button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:14px;background:var(--surface);font-size:12px;font-weight:600;text-align:center}
.catgrid button.on{outline:2px solid var(--accent)}
.catgrid .tile{width:44px;height:44px;font-size:22px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:2px 16px 10px}
.calgrid .cwd{text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;padding-bottom:4px}
.calgrid button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;aspect-ratio:1;border-radius:12px;background:var(--surface);font-size:12.5px;font-weight:600;position:relative}
.calgrid button.out{opacity:.32;background:transparent}
.calgrid button.today{outline:2px solid var(--accent)}
.calgrid button.sel{background:var(--accent);color:var(--accent-ink)}
.calgrid button .dot{width:5px;height:5px;border-radius:50%;position:absolute;bottom:5px}
.calgrid button .damt{font-size:9px;font-weight:700}
.viewtoggle{display:flex;gap:6px;padding:0 16px 10px}
.viewtoggle button{flex:1;padding:8px;border-radius:10px;background:var(--surface2);font-size:13px;font-weight:600;color:var(--muted)}
.viewtoggle button.on{background:var(--accent);color:var(--accent-ink)}
.subhead{padding:14px 20px 4px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;display:flex;justify-content:space-between;align-items:baseline}
.credinp{width:240px;padding:13px 14px;border-radius:12px;background:var(--surface);border:0;outline:0;font-size:16px;text-align:center;color:var(--ink)}
.credwrap{position:relative;width:240px}
.credwrap .credinp{width:100%}
.credeye{position:absolute;right:6px;top:6px;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.badge{display:inline-block;padding:1px 7px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:600;margin-left:6px}
.badge.warn{background:rgba(185,110,0,.14);color:var(--warn)}
.legend{display:flex;align-items:center;gap:10px;padding:8px 14px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.photo{max-width:100%;border-radius:12px;display:block;margin:8px auto}

/* quick entry */
.qe{padding:6px 16px 14px}
.qe .inp{display:flex;gap:8px;align-items:flex-start;background:var(--surface);border-radius:16px;padding:10px 12px}
.qe textarea{flex:1;border:0;outline:0;background:transparent;resize:none;font-family:var(--f-d);font-size:22px;font-weight:500;letter-spacing:-.01em;min-height:64px}
.qe .chipsrow{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px;min-height:46px}
.qc{display:inline-flex;flex-direction:column;background:var(--surface);border-radius:12px;padding:6px 11px;animation:pop .18s ease-out;text-align:left}
.qc small{font-size:10.5px;color:var(--muted);line-height:1.1}
.qc span{font-weight:600;font-size:14px}
.qc.miss{outline:1.5px dashed var(--warn)}
.qc.ok{background:var(--accent-soft)}
@keyframes pop{from{transform:scale(.92);opacity:.4}to{transform:none;opacity:1}}
.hints{display:flex;gap:8px;overflow-x:auto;padding:0 0 6px;scrollbar-width:none}
.hints button{flex:none;background:var(--surface2);border-radius:10px;padding:6px 10px;font-size:13px;color:var(--muted)}

/* nav */
.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;background:var(--tabbg);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:10.5px;font-weight:600;color:var(--muted)}
.tab.on{color:var(--accent)}
.tab.add .plus{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;margin-top:-24px;box-shadow:0 8px 18px -6px var(--accent)}

/* sheets */
.sheet-back{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.sheet-back.in{opacity:1}
.sheet{width:100%;max-width:520px;max-height:94%;background:var(--bg);border-radius:22px 22px 0 0;display:flex;flex-direction:column;transform:translateY(28px);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.full{height:94%}
.sheet-back.in .sheet{transform:none}
.sheet-head{display:flex;align-items:center;gap:8px;padding:12px 14px 6px}
.sheet-title{flex:1;text-align:center;font-family:var(--f-d);font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-actions{min-width:38px;display:flex;justify-content:flex-end;gap:6px}
.sheet-body{overflow:auto;-webkit-overflow-scrolling:touch;padding:6px 0 26px;flex:1}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;z-index:90;opacity:0;transition:all .2s;display:flex;gap:14px;align-items:center;max-width:92%;font-size:14px}
.toast.in{opacity:1;transform:translate(-50%,0)}
.toast button{color:var(--accent);font-weight:700;filter:brightness(1.6)}
.lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.dots{display:flex;gap:14px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}.dots i.f{background:var(--ink)}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.keypad button{height:72px;border-radius:50%;background:var(--surface);font-family:var(--f-d);font-size:26px}
.banner{margin:8px 16px 12px;padding:10px 14px;border-radius:12px;background:var(--warn);color:#fff;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:95;width:100%;height:100%}
.sel{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:inline-flex;align-items:center;justify-content:center;color:#fff}
.sel.on{background:var(--accent);border-color:var(--accent)}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:calc(100% - 32px);max-width:488px;background:var(--ink);color:var(--bg);border-radius:16px;padding:8px;display:flex;gap:4px;z-index:30}
.selbar button{flex:1;padding:9px 4px;border-radius:10px;font-weight:600;font-size:13px;color:var(--bg)}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:12px;padding:0 12px;margin:0 16px 12px;height:40px;color:var(--muted)}
.searchbox input{flex:1;border:0;background:transparent;outline:0;font-size:16px;color:var(--ink);min-width:0}
textarea.bulk{width:calc(100% - 32px);margin:0 16px;min-height:150px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
table.mp{width:100%;border-collapse:collapse;font-size:13px}
table.mp td,table.mp th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.scrollx{overflow-x:auto;margin:0 16px 12px;background:var(--surface);border-radius:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.lock.shake .dots{animation:shake .4s}
</style>
<div id="app"><div id="view"></div></div>
<nav class="tabs" id="tabs" aria-label="Navegación principal"></nav>
<script>
